name: Validate

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  powershell-lint:
    name: PowerShell Syntax Check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path . -Recurse -Filter "*.ps1" |
            Where-Object { $_.FullName -notmatch '\\\.git\\' }

          $errors = @()
          foreach ($script in $scripts) {
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$null, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              foreach ($err in $parseErrors) {
                $errors += "$($script.Name): $($err.Message) (line $($err.Extent.StartLineNumber))"
              }
            }
          }

          if ($errors.Count -gt 0) {
            Write-Host "PowerShell syntax errors found:" -ForegroundColor Red
            $errors | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
            exit 1
          }

          Write-Host "All PowerShell scripts passed syntax check ($($scripts.Count) files)." -ForegroundColor Green

  structure-check:
    name: Repository Structure Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          required_files=(
            "setup.ps1"
            "start-stack.bat"
            "stop-stack.bat"
            "README.md"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
            "templates/apache-httpd.conf.example"
            "templates/php-php.ini.example"
            "templates/mysql-my.ini.example"
          )

          missing=()
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              missing+=("$f")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required files:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

          echo "All required files present."
