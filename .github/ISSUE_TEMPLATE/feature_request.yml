name: Feature Request
description: Suggest an improvement or new feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? We'd love to hear it. Please check existing issues first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or limitation you're hitting.
      placeholder: It's annoying that I have to manually edit httpd.conf to change the port...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
      placeholder: Add a --port flag to setup.ps1 so the Apache port can be set at setup time.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds you've tried, or other ways this could be solved.

  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to implement this yourself?
      options:
        - "Yes, I'd like to open a PR"
        - "Maybe, I'd need some guidance"
        - "No, just suggesting"
    validations:
      required: true
