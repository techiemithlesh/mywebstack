name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill this out so we can reproduce and fix the issue quickly.

  - type: dropdown
    id: os
    attributes:
      label: Windows Version
      options:
        - Windows 11
        - Windows 10
        - Windows Server 2022
        - Windows Server 2019
        - Other
    validations:
      required: true

  - type: dropdown
    id: method
    attributes:
      label: How did you set up MyWebStack?
      options:
        - Pre-bundled ZIP release
        - Automated setup (setup.ps1)
        - Manual setup
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I run start-stack.bat, Apache fails to start...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Apache should start and http://localhost should load.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Extract the ZIP to C:\mywebstack
        2. Run start-stack.bat
        3. See error in the console window
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any error messages from the console or log files here.
      render: text

  - type: input
    id: version
    attributes:
      label: MyWebStack version / release tag
      placeholder: v0.1.1
    validations:
      required: true
